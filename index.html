<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anurag Verma — Full Stack Developer, MERN Stack Engineer & AI/ML specialist. Building production-grade web applications and intelligent systems." />
    <meta name="keywords" content="Anurag Verma, Full Stack Developer, MERN Stack, React, Node.js, AI, ML, Portfolio" />
    <meta name="author" content="Anurag Verma" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Apply the saved theme before the page paints to prevent a dark-mode flash. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var savedTheme = localStorage.getItem("portfolio-theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          }
        } catch (_) {
          // Keep light mode when browser storage is unavailable.
        }
        document.documentElement.setAttribute("data-theme", theme);
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute("content", theme === "light" ? "#ffffff" : "#030014");
        }
      })();
    </script>

    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Anurag Verma — Full Stack Developer & AI Engineer</title>

    <style>
      /* Match the initial page background to the default light theme. */
      html,
      body {
        background: #ffffff;
        color: #111111;
        margin: 0;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #030014;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
